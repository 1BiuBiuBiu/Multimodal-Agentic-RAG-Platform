name: RAG Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test DeepSeek integration (offline)
        run: python -m unittest discover -s tests -v

      - name: Check DeepSeek credentials
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Configure the DEEPSEEK_API_KEY repository secret before running evaluation."
            exit 1
          fi

      - name: Run ingestion on sample PDF
        run: |
          # Use a small test PDF if real data not available
          python -m ingestion.ingest

      - name: Run RAGAs evaluation
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m evaluation.evaluate

      - name: Check quality gate (faithfulness ≥ 0.70)
        run: |
          python - <<'EOF'
          import json, sys
          scores = json.loads(open("evaluation/latest_scores.json").read())
          faith  = scores.get("faithfulness", 0)
          print(f"Faithfulness: {faith:.4f}")
          if faith < 0.70:
              print("FAIL: faithfulness below threshold 0.70")
              sys.exit(1)
          print("PASS: quality gate passed")
          EOF

      - name: Upload scores as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragas-scores
          path: evaluation/latest_scores.json
